[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentic-rag"
version = "1.0.0"
description = "Enterprise-Grade Multi-Agent Hybrid RAG System with Local Reranking and Automated LLMOps Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "anthropic>=0.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastembed>=0.3.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2.0",
    "numpy>=1.26.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
