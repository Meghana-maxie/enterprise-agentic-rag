version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant_engine
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_rag_api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock-key}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=enterprise_knowledge_base
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  qdrant_data:
